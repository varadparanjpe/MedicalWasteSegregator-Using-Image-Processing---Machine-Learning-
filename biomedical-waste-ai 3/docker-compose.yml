version: "3.9"

services:
  backend:
    build: ./backend
    container_name: biowaste-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/weights:/app/weights
      - ./backend/database:/app/database
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: biowaste-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
